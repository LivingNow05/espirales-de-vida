server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression for fast loading on mobile & desktop
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/x-javascript application/xml application/json image/svg+xml;

    # Cache static assets
    location ~* \.(?:jpg|jpeg|gif|png|ico|cur|gz|svg|svgz|mp4|ogg|ogv|webm|htc|woff2|woff)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    location ~* \.(?:css|js)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Sitemap & robots.txt direct serving
    location = /sitemap-index.xml {
        add_header Content-Type application/xml;
        try_files $uri =404;
    }

    location = /sitemap-0.xml {
        add_header Content-Type application/xml;
        try_files $uri =404;
    }

    location = /sitemap.xml {
        add_header Content-Type application/xml;
        try_files $uri =404;
    }

    location = /robots.txt {
        add_header Content-Type text/plain;
        try_files $uri =404;
    }

    # SPA routing fallback (HTTP 200 OK)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
